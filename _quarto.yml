quarto-required: ">=1.10.0"

project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!PLAN.md"
  preview:
    port: 9000

website:
  title: "~ jim"
  description: "Jim Gardner's personal website and blog: R, Python, Quarto, tooling, and whatever else is on my mind."
  site-url: https://jimgar.github.io
  favicon: "favicon.ico"
  image: cheddar.JPG
  back-to-top-navigation: true
  twitter-card: true
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: ~ home
      - posts.qmd
    right:
      - icon: github
        href: https://github.com/jimgar
      - icon: linkedin
        href: https://www.linkedin.com/in/jim-gardner-330368ab/
      - icon: mastodon
        href: https://hachyderm.io/@jimgar

format:
  html:
    theme:
      light: [default, styles.scss, light.scss]
      dark: [default, styles.scss, dark.scss]
    respect-user-color-scheme: true
    code-link: true
    toc: true
    date-format: "D MMMM YYYY"
