quarto-required: ">=1.10.0"

project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "posts/**/*.qmd"
    - "!PLAN.md"
  preview:
    port: 9000

website:
  title: "~ jim"
  description: "Jim Gardner's personal website and blog: R, Python, Quarto, tooling, and whatever else is on my mind."
  site-url: https://jimgar.github.io
  favicon: "favicon.ico"
  twitter-card: true
  open-graph: true
  navbar:
    left:
      - href: index.qmd
        text: ~ home
      - posts.qmd
    right:
      - icon: github
        href: https://github.com/jimgar
      - icon: stack-overflow
        href: https://stackoverflow.com/users/20624624/jimgar
      - icon: linkedin
        href: https://www.linkedin.com/in/jim-gardner-330368ab/
      - icon: mastodon
        href: https://www.hachyderm.io/@jimgar

format:
  html:
    code-link: true
    theme: [darkly, styles.scss]
    mainfont: Atkinson Hyperlegible
    toc: true
